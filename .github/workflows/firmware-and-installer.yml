name: Build firmware and publish web installer

# Builds the pre-built firmware for every supported chip (firmware/*.factory.yaml)
# with ESPHome's official build action, combines them into one ESP Web Tools manifest
# and publishes the installer page (site/) plus the firmware on GitHub Pages.

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "firmware/**"
      - "site/**"
      - ".github/workflows/firmware-and-installer.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-and-installer
  cancel-in-progress: true

env:
  ESPHOME_VERSION: "2026.10.2"

jobs:
  build:
    name: Build ${{ matrix.chip }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chip: [esp32, esp32-s3, esp32-c3]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Build firmware
        id: build
        uses: esphome/build-action@ae5408cdbc4f70692bf8e345c4982bca05a93667  # v8.1.0
        with:
          yaml-file: firmware/room-node-${{ matrix.chip }}.factory.yaml
          version: ${{ env.ESPHOME_VERSION }}
          complete-manifest: true

      - name: Collect output
        run: |
          mkdir -p "output/${{ matrix.chip }}"
          mv "${{ steps.build.outputs.name }}"/* "output/${{ matrix.chip }}/"
          ls -la "output/${{ matrix.chip }}"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: firmware-${{ matrix.chip }}
          path: output
          retention-days: 7

  site:
    name: Assemble installer site
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Download firmware artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: files
          pattern: firmware-*
          merge-multiple: true

      - name: Combine manifests
        run: |
          set -euo pipefail
          mkdir -p site/firmware
          for chip in files/*; do
            cp "$chip"/* site/firmware/
          done
          rm -f site/firmware/manifest.json
          jq -s '(.[0] | del(.builds)) + {"name": "ESPHome Room Presence", "builds": (reduce .[].builds as $b ([]; . + $b))}' \
            files/*/manifest.json > site/firmware/room-node.manifest.json
          cat site/firmware/room-node.manifest.json
          ls -la site/firmware

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site
          retention-days: 1

  deploy:
    name: Publish to GitHub Pages
    needs: site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
