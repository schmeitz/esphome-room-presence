# Core: board, network, Home Assistant API, OTA and maintenance buttons.
# Contains NO secrets, so it is also used for the public pre-built firmware.
# Your own credentials are added by credentials.yaml (see room-node.yaml).

substitutions:
  name: room-node
  friendly_name: Room node
  board: esp32dev
  log_level: INFO

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2025.6.0
  project:
    name: schmeitz.esphome-room-presence
    version: "1.1.0"

esp32:
  board: ${board}
  framework:
    # ESP-IDF is the recommended framework for Bluetooth proxies (less RAM, better BLE/Wi-Fi coexistence).
    type: esp-idf

logger:
  level: ${log_level}

api:

# OTA (over-the-air updates) is added by credentials.yaml (with password) or by the
# pre-built firmware in firmware/ (without password, for adoption).

safe_mode:

wifi:
  # Do NOT set power_save_mode: none here. With Bluetooth active the ESP32 needs
  # modem sleep for Wi-Fi/BLE coexistence; ESPHome picks the right default.
  # Fallback hotspot (named after the node) when no known Wi-Fi network is reachable.
  ap:

captive_portal:

button:
  - platform: restart
    name: Restart
  - platform: safe_mode
    name: Restart (safe mode)
