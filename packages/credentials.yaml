# Your own credentials, for nodes you manage in your own ESPHome Device Builder.
# Secrets expected in your ESPHome secrets.yaml (tools/Deploy-ToHomeAssistant.ps1 creates them):
#   wifi_ssid, wifi_password,
#   room_node_api_key, room_node_ota_password, room_node_ap_password, room_node_web_password

api:
  encryption:
    key: !secret room_node_api_key

ota:
  - platform: esphome
    password: !secret room_node_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    password: !secret room_node_ap_password

web_server:
  auth:
    username: admin
    password: !secret room_node_web_password
