# Add these keys to your ESPHome secrets.yaml (never commit the real file).
wifi_ssid: "YourWiFi"
wifi_password: "YourWiFiPassword"

# Shared by all room nodes. Generate the API key with: openssl rand -base64 32
# (or let tools/Deploy-ToHomeAssistant.ps1 generate all three).
room_node_api_key: "base64-32-byte-key="
room_node_ota_password: "long-random-password"
room_node_ap_password: "fallback-hotspot-password"
room_node_web_password: "password-for-the-node-web-page"
